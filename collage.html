<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babaservices – Création site web</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@900&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Velvet / satin background ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(20,20,20,0.95) 0%, #000 70%),
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.012) 0px,
          rgba(255,255,255,0.012) 1px,
          transparent 1px,
          transparent 6px
        );
    }
    /* spotlight pools */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 55% 40% at 28% 55%, rgba(0,255,100,0.045) 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 72% 45%, rgba(0,255,100,0.035) 0%, transparent 65%),
        radial-gradient(ellipse 30% 25% at 50%  5%, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Stage ── */
    .stage {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
      padding: 40px 20px;
    }

    /* ── Smoke wisps ── */
    .smoke {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .smoke span {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0;
      animation: drift 14s infinite ease-in-out;
    }
    .smoke span:nth-child(1){ width:300px;height:200px;left:5%;top:60%; background:rgba(0,200,80,0.06); animation-delay:0s; }
    .smoke span:nth-child(2){ width:250px;height:180px;left:70%;top:30%; background:rgba(0,200,80,0.05); animation-delay:4s; }
    .smoke span:nth-child(3){ width:200px;height:160px;left:40%;top:75%; background:rgba(0,200,80,0.04); animation-delay:8s; }
    @keyframes drift {
      0%   { opacity:0; transform: translateY(0)   scale(1); }
      30%  { opacity:1; }
      70%  { opacity:0.6; }
      100% { opacity:0; transform: translateY(-80px) scale(1.3); }
    }

    /* ══════════════════════════════════════════
       SVG / clip-path letter blocks
    ══════════════════════════════════════════ */
    .letterblock {
      display: block;
      line-height: 1;
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* Row 1 – BABASERVICES */
    .row1 { font-size: clamp(72px, 12vw, 140px); }
    /* Row 2 – CRÉATION */
    .row2 { font-size: clamp(56px, 9vw, 108px); }
    /* Row 3 – SITE WEB */
    .row3 { font-size: clamp(56px, 9vw, 108px); }

    /* ── Green glow text outline fill ── */
    .letterblock text {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-weight: 900;
      letter-spacing: 0.04em;
      fill: none;
      paint-order: stroke fill;
    }

    /* ── Separator line ── */
    .sep {
      width: 60%; max-width: 640px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,255,100,0.5) 30%,
        rgba(0,255,100,0.9) 50%,
        rgba(0,255,100,0.5) 70%,
        transparent 100%
      );
      margin: 6px auto;
      box-shadow: 0 0 8px rgba(0,255,100,0.6);
    }

    /* ── Tagline ── */
    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(10px, 1.5vw, 15px);
      font-weight: 400;
      letter-spacing: 0.35em;
      color: rgba(0,255,100,0.65);
      text-transform: uppercase;
      text-align: center;
      margin-top: 10px;
      text-shadow: 0 0 12px rgba(0,255,100,0.4);
    }
  </style>
</head>

<!-- ── Canvas-based ambient particle effect ── -->
<canvas id="particles" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>

<script>
(function(){
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, pts = [];
  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function rand(a,b){ return a + Math.random()*(b-a); }
  function init(){
    pts = [];
    for(let i=0; i<55; i++){
      pts.push({
        x: rand(0,W), y: rand(0,H),
        r: rand(0.6,2.2),
        vx: rand(-0.15,0.15),
        vy: rand(-0.25,-0.05),
        a: rand(0.1,0.55),
        da: rand(-0.003,0.003)
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      p.x += p.vx; p.y += p.vy; p.a += p.da;
      if(p.a < 0.05) p.da =  Math.abs(p.da);
      if(p.a > 0.6)  p.da = -Math.abs(p.da);
      if(p.y < -4){ p.y = H+4; p.x = rand(0,W); }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,255,100,${p.a})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  resize(); init(); tick();
  window.addEventListener('resize', ()=>{ resize(); init(); });
})();
</script>
</body>
</html>
